<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GameVault Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-zinc-950 text-white min-h-screen">

  <!-- LOADING -->

  <div
    id="loading"
    class="fixed inset-0 bg-zinc-950 flex items-center justify-center z-50"
  >

    <div
      class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"
    ></div>

  </div>

  <!-- NAVBAR -->

  <nav class="bg-zinc-900 border-b border-zinc-800 p-4 flex justify-between items-center">

    <h1 class="text-2xl font-bold text-blue-500">
      🎮 GameVault
    </h1>

    <div class="flex items-center gap-4">

      <span id="user-email" class="text-zinc-400"></span>

      <button
        id="logout-btn"
        class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg"
      >
        Sair
      </button>

    </div>

  </nav>

  <!-- CONTEÚDO -->

  <main class="p-8">

    <div class="flex justify-between items-center mb-8">

      <div>

        <h2 class="text-4xl font-bold">
          Seus Games
        </h2>

        <p class="text-zinc-400 mt-2">
          Gerencie sua coleção
        </p>

      </div>

      <a
        href="adicionar-game.html"
        class="bg-blue-600 hover:bg-blue-700 px-5 py-3 rounded-xl font-bold"
      >
        + Adicionar Game
      </a>

    </div>

    <!-- PESQUISA E FILTRO -->

    <div class="flex flex-col md:flex-row gap-4 mb-8">

      <input
        type="text"
        id="search-input"
        placeholder="Pesquisar games..."
        class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl w-full outline-none focus:border-blue-500"
      >

      <select
        id="genre-filter"
        class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl outline-none focus:border-blue-500"
      >
        <option value="">Todos os gêneros</option>
        <option value="Ação">Ação</option>
        <option value="RPG">RPG</option>
        <option value="Corrida">Corrida</option>
        <option value="Terror">Terror</option>
        <option value="FPS">FPS</option>
      </select>

    </div>

    <!-- GRID DOS GAMES -->

    <div
      id="games-container"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
    >

    </div>

  </main>

  <!-- TOAST -->

  <div
    id="toast"
    class="fixed top-5 right-5 bg-green-600 text-white px-6 py-4 rounded-xl shadow-2xl hidden z-50 transition-all"
  >
    Operação realizada com sucesso!
  </div>

  <!-- MODAL DELETE -->

  <div
    id="delete-modal"
    class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50"
  >

    <div class="bg-zinc-900 p-8 rounded-2xl border border-zinc-800 w-full max-w-md">

      <h2 class="text-3xl font-bold mb-4">
        Excluir Game
      </h2>

      <p class="text-zinc-400 mb-6">
        Tem certeza que deseja excluir este game?
      </p>

      <div class="flex justify-end gap-4">

        <button
          onclick="fecharModal()"
          class="bg-zinc-700 hover:bg-zinc-600 px-5 py-2 rounded-lg"
        >
          Cancelar
        </button>

        <button
          id="confirm-delete"
          class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-lg"
        >
          Excluir
        </button>

      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="./js/supabase.js"></script>

  <script src="./js/dashboard.js"></script>

</body>
</html>
