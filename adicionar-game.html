<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adicionar Game</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-zinc-950 text-white min-h-screen flex justify-center items-center p-8">

  <div class="bg-zinc-900 p-8 rounded-2xl w-full max-w-2xl border border-zinc-800">

    <h1 class="text-4xl font-bold mb-8">
      🎮 Adicionar Game
    </h1>

    <form id="game-form" class="flex flex-col gap-4">

      <input
        type="text"
        id="nome"
        placeholder="Nome do game"
        class="bg-zinc-800 p-3 rounded-lg"
      >

      <input
        type="text"
        id="genero"
        placeholder="Gênero"
        class="bg-zinc-800 p-3 rounded-lg"
      >

      <input
        type="text"
        id="plataforma"
        placeholder="Plataforma"
        class="bg-zinc-800 p-3 rounded-lg"
      >

      <input
        type="number"
        id="preco"
        placeholder="Preço"
        class="bg-zinc-800 p-3 rounded-lg"
      >

      <textarea
        id="descricao"
        placeholder="Descrição"
        class="bg-zinc-800 p-3 rounded-lg h-32"
      ></textarea>

      <input
        type="text"
        id="imagem_url"
        placeholder="URL da imagem"
        class="bg-zinc-800 p-3 rounded-lg"
      >

      <button
        type="submit"
        class="bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-bold"
      >
        Salvar Game
      </button>

    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="./js/supabase.js"></script>

  <script src="./js/games.js"></script>

</body>
</html>
