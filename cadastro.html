<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GameVault - Cadastro</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-zinc-950 flex items-center justify-center h-screen">

  <div class="bg-zinc-900 p-8 rounded-2xl shadow-2xl w-[400px] border border-zinc-800">

    <h1 class="text-4xl font-bold text-center text-white mb-2">
      🎮 GameVault
    </h1>

    <p class="text-zinc-400 text-center mb-8">
      Crie sua conta
    </p>

    <form id="register-form" class="flex flex-col gap-4">

      <input
        type="text"
        id="nome"
        placeholder="Seu nome"
        class="bg-zinc-800 text-white p-3 rounded-lg outline-none border border-zinc-700 focus:border-blue-500"
      >

      <input
        type="email"
        id="email"
        placeholder="Seu email"
        class="bg-zinc-800 text-white p-3 rounded-lg outline-none border border-zinc-700 focus:border-blue-500"
      >

      <input
        type="password"
        id="password"
        placeholder="Sua senha"
        class="bg-zinc-800 text-white p-3 rounded-lg outline-none border border-zinc-700 focus:border-blue-500"
      >

      <button
        type="submit"
        class="bg-blue-600 hover:bg-blue-700 transition-all p-3 rounded-lg text-white font-bold"
      >
        Criar Conta
      </button>

    </form>

    <p class="text-zinc-400 text-center mt-6">

      Já possui conta?

      <a
        href="login.html"
        class="text-blue-500 hover:text-blue-400"
      >
        Entrar
      </a>

    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script src="./js/supabase.js"></script>

  <script src="./js/cadastro.js"></script>

</body>
</html>
